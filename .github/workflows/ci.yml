name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, PODEMOS-SEGUIR]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_KEY: base64:ABEiM0RVZneImaq7zN3u/wARIjNEVWZ3iJmqu8zd7v8=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict --no-check-publish
      - run: composer audit
      - name: Validate PHP syntax
        run: find app bootstrap config database routes tests motor-experto/src -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - name: Install browser for frontend tests
        run: npx puppeteer browsers install chrome
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --omit=dev
          npm audit --json > npm-audit-full.json || true
          node scripts/verificar-auditoria-npm.mjs npm-audit-full.json
      - run: npm run build
      - name: Frontend with desktop and touch fixtures
        # Las ventanas comparten Xvfb; serializar evita que se roben el foco.
        run: xvfb-run --auto-servernum node --test --test-concurrency=1 "tests/Frontend/**/*.test.js"
        env:
          RM_BROWSER_HEADFUL: '1'
      - name: Independent expert engine
        run: php motor-experto/tests/independencia.php
      - name: Full SQLite suite
        run: composer test -- --log-junit=phpunit-sqlite.xml
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            phpunit-sqlite.xml
            npm-audit-full.json

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: remembermind_test_admin
          POSTGRES_PASSWORD: testing-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remembermind_test_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:ABEiM0RVZneImaq7zN3u/wARIjNEVWZ3iJmqu8zd7v8=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_URL: ''
      DB_PASSWORD: testing-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, gd, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Create disposable database and restricted runner
        shell: bash
        env:
          PGPASSWORD: testing-only
        run: |
          db_name="remembermind_test_$(openssl rand -hex 4)_testing"
          db_runner="${db_name}_runner"
          psql -h 127.0.0.1 -U remembermind_test_admin -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE "$db_runner" LOGIN PASSWORD 'testing-only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE "$db_name" OWNER "$db_runner";
          REVOKE CONNECT ON DATABASE "$db_name" FROM PUBLIC;
          GRANT CONNECT ON DATABASE "$db_name" TO "$db_runner";
          SQL
          printf 'DB_DATABASE=%s\nDB_USERNAME=%s\n' "$db_name" "$db_runner" >> "$GITHUB_ENV"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - name: PostgreSQL contracts, role login and concurrency
        run: >-
          php vendor/phpunit/phpunit/phpunit -c phpunit.postgres.xml
          --filter 'FotografiasHeridasTest|FotografiasHeridasMigrationTest|GaleriaInstitucionalTest|GaleriaInstitucionalConcurrenciaPostgresTest|GerenciaDashboardTest|PersonalInstitucionalResponsiveTest|CodigosCorrelativosTest|AsignacionesJornadaPlanificadaTest|AccesoDashboardPorRolTest|AuthenticationTest|BddOperativaV2Test|ContratoPersonalInstitucionalTest|ContratoDocumentacionUsuarioTest|ContratoSeguridadCuentaTest|FichaCuidadosTest|CargaConocimientoOrionTest|ConocimientoPanelTest|RolesVistasPermisosMatrixTest|Fase3AdmisionAtomicidadTest|AlojamientoBloqueoPostgresTest|Fase3ConcurrenciaCamaPostgresTest|PersistenciaExpertaTest|InformeCognitivoTest|InformeNeurocognitivoTest|ResumenCognitivoResidenteTest|DolorMigrationTest|DesacoplamientoContextoTest|PanelAlertaPreparadoTest|ConsultasPorCapaTest|ExploradorAdministrativoTest|ApplicationBoundaryTest|DesacoplamientoArchivosTest|ReportesPortabilidadTest|FrontendRestauradoV2Test|PantallasConectadasTest|VistasModularesTest|DashboardAdministracionIntegracionVisualTest|GobiernoReglasExpertasTest|GobiernoReglasConcurrenciaPostgresTest|SucesionObservacionalTest|HallazgosObservacionalesTest|PreparacionInstrumentalInvestigadaTest'
          --log-junit=phpunit-postgres.xml
      - name: PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence
          path: phpunit-postgres.xml
