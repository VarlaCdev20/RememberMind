name: CI

on:
  pull_request:
  push:
    branches: [RESTRUCTURACION, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: remembermind_test
          POSTGRES_USER: remembermind
          POSTGRES_PASSWORD: testing-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remembermind -d remembermind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:ABEiM0RVZneImaq7zN3u/wARIjNEVWZ3iJmqu8zd7v8=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: remembermind_test
      DB_USERNAME: remembermind
      DB_PASSWORD: testing-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit
      - name: Validate PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
